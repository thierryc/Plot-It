name: Publish Mac update feed
on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: mac-update-feed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify published archives and prepare feed
        run: node scripts/sync-mac-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit publication metadata and deploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/macos/appcast.xml site/macos/release.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified Mac update feed"
            git push origin HEAD:main
          fi
          gh workflow run pages.yml --ref main
